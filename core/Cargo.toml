[package]
name = "bible-core"
version = "0.9.0"
edition = "2024"
license = "MIT"

[lib]
name = "bible_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
serde_json = "1"
