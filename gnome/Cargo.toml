[package]
name = "bibbia-gnome"
version = "0.14.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "bibbia"
path = "src/main.rs"

[dependencies]
bible-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk = { package = "gtk4", version = "0.10", features = ["v4_8"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_2"] }
futures-channel = "0.3"
cairo-rs = { version = "0.21", features = ["pdf"] }
pangocairo = "0.21"

[dev-dependencies]
tempfile = "3"
